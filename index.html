<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>萤星</title>
<meta name="description" content="萤星 · CET4 3000 词 + 雅思 2972 词，闪卡 / 测验 / 词库，离线可用">
<meta name="theme-color" content="#e9f1ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="萤星">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff9c4'/%3E%3Cstop offset='.55' stop-color='%23ffd54a'/%3E%3Cstop offset='1' stop-color='%23ffb300' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='17' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#eef2f9; --bg2:#dfe7f5; --card:#fff; --text:#1c2434; --muted:#6b7891;
    --line:#e3e8f1; --brand:#3b6ef5; --brand-soft:#eaf0ff;
    --ok:#12a06a; --ok-soft:#e6f7ef; --bad:#e0463c; --bad-soft:#fdecea;
    --radius:20px;
    --shadow:0 10px 30px rgba(24,40,80,.10);
    /* 页面底色拆两层：底渐变铺在 body 上（静止不动），四团色斑（蓝/紫/青/粉）
       搬到 .bg-flow 里各自漂移。色相/明度/位置沿用原来 background 里的值。 */
    --page-base:linear-gradient(178deg,#e9f1ff 0%,#e1ebfa 52%,#d9e5f6 100%);
    --blob-a:rgba(88,132,255,.72);
    --blob-b:rgba(170,124,255,.58);
    --blob-c:rgba(64,200,255,.40);
    --blob-d:rgba(255,158,214,.34);
    --sheen:rgba(255,255,255,.20);
    /* 封面只留一层不透明渐变，色斑交给 .cover-flow 自己流动 */
    --cover-bg:linear-gradient(178deg,#fbfdff,#f2f7ff);
    --cv-a:rgba(120,160,255,.28);
    --cv-b:rgba(90,210,255,.22);
    --cv-c:rgba(170,124,255,.12);
    /* ---------- 液态玻璃 ----------
       一块玻璃由四层叠出来：① 半透明底 ② 背后模糊+提饱和 ③ 内侧白高光（镜面边）
       ④ 柔和外投影。少哪一层都会「像一块灰色塑料」而不是玻璃。
       模糊只给大块（面板/卡片/选项/主按钮），小按钮和列表行不用 —— 词库页一次
       能出现 300 个行内按钮，每个都 backdrop-filter 会直接把帧率打穿。 */
    --glass:rgba(255,255,255,.42);
    --glass-strong:rgba(255,255,255,.62);
    --glass-line:rgba(255,255,255,.78);
    --glass-blur:blur(26px) saturate(190%);
    --glass-hl:0 1.5px 0 rgba(255,255,255,.95) inset, 0 0 0 1px rgba(255,255,255,.5) inset, 0 -1px 0 rgba(255,255,255,.28) inset;
    --glass-drop:0 14px 38px rgba(24,40,80,.13), 0 3px 10px rgba(24,40,80,.06);
    /* 果冻：按下要快（80ms 收紧），松开要弹（带回弹的曲线慢慢放开） */
    --jelly-out:cubic-bezier(.34,1.56,.64,1);
    /* 底部导航栏抬升量：由 JS 按 visualViewport 实时写入，防止被手机浏览器工具栏盖住 */
    --nav-lift:0px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  /* 禁用系统字体自动放大，避免 WebView 自作主张把文字撑大 */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    /* 玻璃得有东西可透，否则只是一层灰白。背景铺几团饱和一点的色斑
       （蓝/紫/青/粉），面板浮在上面时不同位置能透出不同色相 —— 这是「液态」的来源。
       色斑太淡 = 玻璃看起来像白塑料，所以这里的 alpha 不能省。 */
    background:var(--page-base);
    color:var(--text); min-height:100vh; min-height:100dvh;
    padding:calc(26px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(104px + var(--nav-lift,0px) + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));
    line-height:1.6;
  }

  /* ---------- 流动背景 ----------
     4 团色斑（蓝/紫/青/粉）+ 一道斜向流光，全部只动 transform：
     走合成层，不重排不重绘。周期 33/38/47/55s 互质，十几分钟内看不出循环点。
     色斑用 radial-gradient(closest-side)，盒子多大渐变就多大。
     z-index:-1 让它待在玻璃、封面、激活闸门之下，只当「透光的东西」。 */
  .bg-flow{
    position:fixed;inset:0;z-index:-1;
    overflow:hidden;pointer-events:none;
    contain:strict;
  }
  .bg-flow i{
    position:absolute;display:block;border-radius:50%;
    background:radial-gradient(closest-side,var(--c) 0%,transparent var(--fade,64%));
    will-change:transform;
    transform:translate3d(0,0,0);
  }
  .bg-flow i:nth-child(1){          /* 蓝 · 左上 */
    --c:var(--blob-a);--fade:62%;
    width:58vw;height:62vh;left:-21vw;top:-37vh;
    animation:flowA 38s cubic-bezier(.37,0,.63,1) infinite;
  }
  .bg-flow i:nth-child(2){          /* 紫 · 右上 */
    --c:var(--blob-b);--fade:64%;
    width:52vw;height:55vh;left:68vw;top:-23.5vh;
    animation:flowB 47s cubic-bezier(.37,0,.63,1) infinite;
  }
  .bg-flow i:nth-child(3){          /* 青 · 底部 */
    /* 原来 top:72vh，圆心在 106vh —— 屏幕底边离核心只有 50px，
       于是导航胶囊后面永远压着一条饱和青蓝，玻璃一采样就是「底下垫了块蓝布」。
       下移到 82vh（圆心 116vh），底边落到 0.5R 之外，只剩一层很淡的余光。 */
    --c:var(--blob-c);--fade:70%;
    width:66vw;height:68vh;left:13vw;top:82vh;
    animation:flowC 33s cubic-bezier(.37,0,.63,1) infinite;
  }
  .bg-flow i:nth-child(4){          /* 粉 · 右中 */
    --c:var(--blob-d);--fade:62%;
    width:46vw;height:40vh;left:65vw;top:56vh;
    animation:flowD 55s cubic-bezier(.37,0,.63,1) infinite;
  }
  /* 底部收边：导航胶囊是浮在页面上的，底下要是正好压着一团色斑，
     胶囊轮廓就成了一条硬边，看着像「底下垫了块蓝布」。
     用一层跟底色同调的渐变把最底下 240px 慢慢收干净 —— 只压背景
     （.bg-flow 在 z-index:-1），不压上面的文字和列表。 */
  .bg-flow::before{
    content:"";position:absolute;left:0;right:0;bottom:0;height:240px;z-index:2;
    background:linear-gradient(to top,rgba(216,228,246,.92) 0%,rgba(216,228,246,.60) 42%,transparent 100%);
  }
  /* 流光：一条很宽的斜向高光慢慢扫过去，玻璃面板会跟着「亮一下」，压得很淡 */
  .bg-flow::after{
    content:"";position:absolute;left:-45%;top:-55%;width:190%;height:210%;
    background:linear-gradient(102deg,transparent 34%,var(--sheen) 47%,transparent 60%);
    opacity:.45;will-change:transform;
    animation:flowSheen 31s cubic-bezier(.42,0,.58,1) infinite;
  }
  /* 每条路径首尾同形才能无缝接上，别改成 alternate —— 会看到「到顶了往回弹」。
     位移上限约 ±11vw / ±13vh，配合 1.16~.90 的胀缩：色斑锚在原地缓慢呼吸，不是飘走。 */
  @keyframes flowA{
    0%  {transform:translate3d(0,0,0) rotate(0deg) scale(1)}
    25% {transform:translate3d(7vw,9vh,0) rotate(6deg) scale(1.10)}
    50% {transform:translate3d(11vw,4vh,0) rotate(-4deg) scale(.95)}
    75% {transform:translate3d(4vw,-6vh,0) rotate(3deg) scale(1.05)}
    100%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}
  }
  @keyframes flowB{
    0%  {transform:translate3d(0,0,0) rotate(0deg) scale(1)}
    25% {transform:translate3d(-6vw,8vh,0) rotate(-8deg) scale(1.08)}
    50% {transform:translate3d(-10vw,12vh,0) rotate(6deg) scale(.94)}
    75% {transform:translate3d(-4vw,3vh,0) rotate(-3deg) scale(1.04)}
    100%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}
  }
  @keyframes flowC{
    0%  {transform:translate3d(0,0,0) rotate(0deg) scale(1)}
    30% {transform:translate3d(9vw,-7vh,0) rotate(5deg) scale(1.10)}
    62% {transform:translate3d(-7vw,-11vh,0) rotate(-6deg) scale(.93)}
    85% {transform:translate3d(-2vw,-4vh,0) rotate(2deg) scale(1.04)}
    100%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}
  }
  @keyframes flowD{
    0%  {transform:translate3d(0,0,0) rotate(0deg) scale(1)}
    40% {transform:translate3d(-8vw,-9vh,0) rotate(-8deg) scale(1.16)}
    70% {transform:translate3d(6vw,-13vh,0) rotate(6deg) scale(.90)}
    100%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}
  }
  @keyframes flowSheen{
    0%  {transform:translate3d(-12%,-9%,0) rotate(-2deg)}
    50% {transform:translate3d(11%,9%,0) rotate(3deg)}
    100%{transform:translate3d(-12%,-9%,0) rotate(-2deg)}
  }
  /* 切后台就停：合成层的动画 WebView 不一定帮你停，白烧电 */
  html.flow-pause .bg-flow i,
  html.flow-pause .bg-flow::after{animation-play-state:paused}
  /* 系统开了「减少动态效果」就不动，但色斑还在（只是不飘） */
  @media (prefers-reduced-motion:reduce){
    .bg-flow i,.bg-flow::after,.cover-flow i{animation:none}
  }
  /* 封面自己的流动层：三团很淡的色斑慢慢胀缩，跟主界面同一套 keyframes */
  .cover-flow{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .cover-flow i{
    position:absolute;display:block;border-radius:50%;
    background:radial-gradient(closest-side,var(--c) 0%,transparent 66%);
    will-change:transform;transform:translate3d(0,0,0);
  }
  .cover-flow i:nth-child(1){--c:var(--cv-a);width:70vw;height:58vh;left:-16vw;top:-28vh;animation:flowA 34s cubic-bezier(.37,0,.63,1) infinite}
  .cover-flow i:nth-child(2){--c:var(--cv-b);width:72vw;height:60vh;left:50vw;top:54vh;animation:flowC 27s cubic-bezier(.37,0,.63,1) infinite}
  .cover-flow i:nth-child(3){--c:var(--cv-c);width:54vw;height:46vh;left:58vw;top:-18vh;animation:flowB 41s cubic-bezier(.37,0,.63,1) infinite}
  .wrap{max-width:900px;margin:0 auto}
  .top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;margin-bottom:16px}

  /* 玻璃面板的通用写法，各组件 @extend 式地复用这几条 */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:var(--glass-blur);
    backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-line);
    box-shadow:var(--glass-hl), var(--glass-drop);
  }
  /* 不支持 backdrop-filter 时退回接近实色的白，至少不难看 */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .glass{background:rgba(255,255,255,.94)}
  }

  /* 顶部品牌胶囊：点按可切换词库（CET4 / CET6 / 雅思） */
  .brand-pill{
    position:relative;z-index:82;
    display:inline-flex;align-items:center;justify-content:center;
    padding:7px 11px 7px 18px;border-radius:999px;
    border:0;font-family:inherit;cursor:pointer;
    background:linear-gradient(135deg,#7aa2ff 0%,#3b6ef5 55%,#2b52c4 100%);
    color:#fff;font-size:15px;font-weight:800;letter-spacing:2px;
    line-height:1.2;
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 0 0 1px rgba(59,110,245,.18),
      0 6px 16px rgba(59,110,245,.30);
    text-shadow:0 1px 2px rgba(20,40,100,.28);
    user-select:none;-webkit-user-select:none;
    transition:transform .38s var(--jelly-out), box-shadow .2s;
  }
  .brand-pill:active{transform:scale(.93);transition-duration:.08s, .2s}
  .brand-pill .bp-caret{
    width:13px;height:13px;margin-left:5px;flex:none;opacity:.92;
    transition:transform .24s cubic-bezier(.3,1.3,.5,1);
  }
  .brand-pill[aria-expanded="true"] .bp-caret{transform:rotate(180deg)}

  /* 词库选择：三颗小胶囊，从品牌胶囊下方弹出 */
  .bank-mask{position:fixed;inset:0;z-index:81;background:transparent}
  .bank-pop{
    position:absolute;left:0;top:calc(100% + 8px);z-index:83;
    display:flex;gap:5px;padding:5px;border-radius:999px;
    background:rgba(255,255,255,.58);
    -webkit-backdrop-filter:blur(20px) saturate(190%);
    backdrop-filter:blur(20px) saturate(190%);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 0 0 1px rgba(255,255,255,.55) inset,
      0 2px 6px rgba(24,40,80,.08),
      0 14px 32px rgba(24,40,80,.18);
    transform-origin:14px 0;
    /* 弹出时冲过 1.0 再回落，像被弹出来的 */
    animation:bankPop .34s cubic-bezier(.34,1.62,.52,1) both;
  }
  .bank-pop[hidden]{display:none}
  @keyframes bankPop{from{opacity:0;transform:scale(.78) translateY(-6px)}to{opacity:1;transform:none}}
  .bank-chip{
    border:1px solid rgba(255,255,255,.7);font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.4px;
    padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
    background:rgba(255,255,255,.55);color:#5b6784;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset;
    transition:transform .34s var(--jelly-out), background .18s, color .18s, box-shadow .18s;
  }
  .bank-chip:active{transform:scale(.9);transition-duration:.08s, .18s, .18s, .18s}
  .bank-chip.on{
    background:linear-gradient(180deg,#5a86ff,#3b6ef5);border-color:rgba(255,255,255,.45);color:#fff;
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 4px 12px rgba(59,110,245,.35);
  }

  /* ---------- 底部导航：液态玻璃（移植 AndroidLiquidGlass 的分层折射思路） ----------
     参考 Kyant0/AndroidLiquidGlass 的 LiquidBottomTabs：
     ① 玻璃主体 = vibrancy(饱和) + blur(8dp) + lens(24dp) —— Web 端用「分层采样」近似：
        lg-core 中心强模糊，lg-ring-tb / lg-ring-lr 在边缘放大采样后再用线性遮罩裁出边缘，
        让背景在玻璃边缘被"弯折"，即折射
     ② lg-chroma 色散边：青/品红细内环，模拟厚玻璃的波长分离
     ③ nav-lens 选中指示器：整块玻璃里滑动的液态胶囊，位置由弹簧驱动，
        并按速度做「横向拉伸 + 纵向压扁」，对应库中 velocity → scaleX/scaleY 的写法
     */
  .tabs{
    /* 库里的 accentColor = 0xFF0088FF，单独用一个变量，避免污染正文的品牌色 */
    --nav-accent:#0088ff;
    position:fixed;z-index:60;
    /* 整条 bar 从页面滚动里摘出来：在上面横滑/竖滑都不会带动页面，
       也不会被浏览器当成系统手势而中途发 pointercancel。 */
    touch-action:none;
    left:50%;transform:translateX(calc(-50% + var(--nav-shift,0px)));
    bottom:calc(25px + var(--nav-lift,0px) + env(safe-area-inset-bottom,0px));
    width:calc(100% - 12px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));max-width:820px;
    /* LiquidBottomTabs：整条 bar 64dp，内边距 4dp → 选中块 56dp */
    height:64px;
    display:flex;gap:2px;align-items:stretch;
    border-radius:999px;
    padding:4px;
    /* containerColor = 0xFAFAFA @ alpha 0.4
       真机上 blur 由 GPU 合成，比库里 vibrancy+blur 稍弱，故略加厚到 .50，
       既保留通透感，又不让背后的文字糊住标签 */
    background:rgba(250,250,250,.50);
    border:1px solid rgba(255,255,255,.62);
    box-shadow:
      /* Highlight.Default：顶部与四周的镜面边缘光 */
      0 1px 0 rgba(255,255,255,.98) inset,
      0 0 0 1px rgba(255,255,255,.26) inset,
      0 -1px 0 rgba(255,255,255,.46) inset,
      /* Shadow：悬浮投影 */
      0 2px 6px rgba(24,40,80,.10),
      0 8px 20px rgba(24,40,80,.15),
      0 16px 44px rgba(24,40,80,.16);
    /* 注意：这里不能加 isolation:isolate —— 它会让 .tabs 成为 backdrop root，
       内部的 backdrop-filter 就只能采样本元素的纯色底，模糊彻底失效 */
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
    /* 注意：--nav-shift 由 navP 弹簧（navPanelTick）逐帧写入，这里不能再加 transition，
       否则每帧都被缓动追一次，整条 bar 会持续「拖尾」 */
  }
  /* ① 玻璃主体：中心强模糊 + 提高饱和（vibrancy）+ blur(8dp) */
  .tabs .lg-core{
    position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
    background:rgba(255,255,255,.08);
    -webkit-backdrop-filter:blur(22px) saturate(142%) brightness(1.02);
    backdrop-filter:blur(22px) saturate(142%) brightness(1.02);
  }
  /* ② 边缘折射环：放大采样 + 线性遮罩
     胶囊是横向长条，上下边缘与左右圆头需要不同方向的缩放才能都产生折射，
     故拆成「上下带」与「左右带」两层，各自用线性遮罩只保留边缘。 */
  .tabs .lg-ring-tb{
    position:absolute;inset:-5px 0;border-radius:999px;pointer-events:none;z-index:0;
    transform:scale(1,1.30);
    background:rgba(255,255,255,.02);
    -webkit-backdrop-filter:blur(1.2px) saturate(150%) brightness(1.05);
    backdrop-filter:blur(1.2px) saturate(150%) brightness(1.05);
    -webkit-mask-image:linear-gradient(180deg,#000 0 15%,transparent 30% 70%,#000 85% 100%);
    mask-image:linear-gradient(180deg,#000 0 15%,transparent 30% 70%,#000 85% 100%);
  }
  .tabs .lg-ring-lr{
    position:absolute;inset:0 -16px;border-radius:999px;pointer-events:none;z-index:0;
    transform:scale(1.24,1);
    background:rgba(255,255,255,.02);
    -webkit-backdrop-filter:blur(1.2px) saturate(150%) brightness(1.05);
    backdrop-filter:blur(1.2px) saturate(150%) brightness(1.05);
    -webkit-mask-image:linear-gradient(90deg,#000 0 7%,transparent 15% 85%,#000 93% 100%);
    mask-image:linear-gradient(90deg,#000 0 7%,transparent 15% 85%,#000 93% 100%);
  }
  /* ③ 色散边：厚玻璃边缘的波长分离（弱化，只在上/下沿轻微显现） */
  .tabs .lg-chroma{
    position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
    box-shadow:
      0 0 0 1px rgba(255,120,60,.12) inset,
      0 0 0 2px rgba(60,150,255,.09) inset;
    -webkit-mask-image:linear-gradient(180deg,#000 0 18%,transparent 34% 66%,#000 82% 100%);
    mask-image:linear-gradient(180deg,#000 0 18%,transparent 34% 66%,#000 82% 100%);
  }
  /* 顶部弧形镜面高光（模拟玻璃厚度处的光反射） */
  .tabs::before{
    content:"";position:absolute;left:12px;right:12px;top:0;height:1.5px;
    border-radius:2px;pointer-events:none;z-index:3;
    background:linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.55) 10%,
      rgba(255,255,255,1) 34%,
      rgba(255,255,255,1) 66%,
      rgba(255,255,255,.55) 90%,
      rgba(255,255,255,0) 100%);
  }
  /* 底部折射余晖：玻璃下沿的二次反光 */
  .tabs::after{
    content:"";position:absolute;left:14px;right:14px;bottom:1px;height:38%;
    border-radius:0 0 999px 999px;pointer-events:none;z-index:2;
    background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.26));
  }

  /* ④ 选中块：对应库里的 lens(10dp, 14dp, chromaticAberration = true)
     56dp 高的玻璃胶囊；边缘两层放大采样做折射，内环做波长分离，
     高光/外发光强度随 pressProgress（--press 0→1）变化 */
  .nav-lens{
    position:absolute;left:0;top:4px;bottom:4px;width:60px;z-index:2;
    border-radius:999px;pointer-events:none;overflow:hidden;
    transform:translate3d(var(--tx,0px),0,0) scaleX(var(--sx,1)) scaleY(var(--sy,1));
    /* 拉伸原点由 --lead 逐帧给：往哪边甩，原点就退到哪边的对侧，
       前缘被拉出去才像液体；居中缩放只会显得整体变胖。 */
    transform-origin:var(--lead,50%) 50%;
    will-change:transform;              /* 每帧改 --tx/--sx，提前提层免得起帧抖动 */
    background:linear-gradient(180deg,rgba(255,255,255,.84) 0%,rgba(248,251,255,.66) 44%,rgba(230,241,255,.78) 100%);
    -webkit-backdrop-filter:blur(8px) saturate(150%) brightness(1.07);
    backdrop-filter:blur(8px) saturate(150%) brightness(1.07);
    box-shadow:
      0 1px 0 rgba(255,255,255,.98) inset,
      0 -1px 0 rgba(255,255,255,.66) inset,
      0 0 0 1px rgba(255,255,255,.86) inset,
      0 1px 3px rgba(24,40,80,.07),
      0 5px 14px rgba(24,40,80,.10),
      0 0 22px rgba(0,136,255,.13);
  }
  /* 边缘折射：上下带 / 左右带各自放大采样，再用线性遮罩只保留边缘
     （lens() 的 refractionHeight = 10dp、cornerRadius = 14dp） */
  .nav-lens .nl-edge-tb,.nav-lens .nl-edge-lr{
    position:absolute;pointer-events:none;border-radius:inherit;
    -webkit-backdrop-filter:blur(1px) saturate(165%) brightness(1.10);
    backdrop-filter:blur(1px) saturate(165%) brightness(1.10);
  }
  .nav-lens .nl-edge-tb{
    inset:-4px 0;transform:scale(1,1.28);
    -webkit-mask-image:linear-gradient(180deg,#000 0 15%,transparent 31% 69%,#000 85% 100%);
    mask-image:linear-gradient(180deg,#000 0 15%,transparent 31% 69%,#000 85% 100%);
  }
  .nav-lens .nl-edge-lr{
    inset:0 -10px;transform:scale(1.22,1);
    -webkit-mask-image:linear-gradient(90deg,#000 0 8%,transparent 19% 81%,#000 92% 100%);
    mask-image:linear-gradient(90deg,#000 0 8%,transparent 19% 81%,#000 92% 100%);
  }
  /* Highlight.Default：斜向镜面高光，按压时更亮 */
  .nav-lens .nl-hl{
    position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(158deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.32) 36%,rgba(255,255,255,0) 62%);
    opacity:calc(.68 + .32 * var(--press,0));
    transition:opacity .16s ease;
  }
  /* chromaticAberration：青 / 品红细内环，模拟厚玻璃的波长分离 */
  .nav-lens .nl-ring{
    position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    box-shadow:
      0 0 0 1px rgba(255,110,70,.20) inset,
      0 0 0 2px rgba(0,150,255,.17) inset;
    opacity:calc(.5 + .5 * var(--press,0));
    transition:opacity .16s ease;
  }
  /* 行进中（弹簧还没停）或正被手指拖着：整条玻璃托起一点，外发光换成强调色 */
  .tabs.moving .nav-lens,
  .tabs.dragging .nav-lens{
    box-shadow:
      0 1px 0 rgba(255,255,255,1) inset,
      0 -1px 0 rgba(255,255,255,.70) inset,
      0 0 0 1px rgba(255,255,255,.95) inset,
      0 3px 8px rgba(24,40,80,.12),
      0 12px 26px rgba(24,40,80,.16),
      0 0 30px rgba(0,136,255,.30);
  }
  /* 拖动中把图标的过渡压短：高亮要跟着胶囊即时交班，
     不压的话每跨一格都会起一段 0.4s 的弹跳，连起来就是「拖泥带水」。 */
  .tabs.dragging button{transition:color .1s linear}
  .tabs.dragging button svg{
    transition:transform .16s cubic-bezier(.3,1.1,.4,1), stroke-width .1s linear, opacity .1s linear;
  }

  .tabs button{
    position:relative;z-index:4;
    flex:1;min-width:0;border:0;background:transparent;color:#7b87a3;font:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:11px;font-weight:500;line-height:1;letter-spacing:.2px;
    padding:7px 4px 6px;border-radius:999px;cursor:pointer;
    transition:color .26s cubic-bezier(.4,0,.2,1);
    white-space:nowrap;-webkit-tap-highlight-color:transparent;
    text-shadow:0 0 5px rgba(255,255,255,.9),0 0 10px rgba(255,255,255,.6);
  }
  .tabs button svg{
    width:21px;height:21px;flex:none;
    fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;
    /* 弹起比胶囊晚一点点、收得比胶囊慢一点点，像被胶囊「带」起来的 */
    transition:transform .4s cubic-bezier(.34,1.3,.42,1), stroke-width .26s ease, opacity .26s ease;
  }
  .tabs button:hover{color:#5b6784}
  .tabs button:not(.on) svg{opacity:.88}
  .tabs button:active svg{transform:scale(.9)}
  /* 选中态：文字上色 + 图标弹起放大（胶囊本体由 .nav-lens 承担） */
  .tabs button.on{color:var(--nav-accent);font-weight:700}
  .tabs button.on svg{stroke-width:2.2;opacity:1;transform:translateY(-1.5px) scale(1.14)}
  /* 不支持 backdrop-filter 时退回高不透明度纯色，保证文字可读 */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .tabs{background:rgba(255,255,255,.90)}
    .tabs .lg-ring-tb,.tabs .lg-ring-lr,
    .nav-lens .nl-edge-tb,.nav-lens .nl-edge-lr{display:none}
    .nav-lens{background:linear-gradient(180deg,#fff,#e9f0ff)}
  }

  /* 页面不再接管横向手势：切页只走底部导航。
     保留 overflow-x:hidden 兜住任何意外横向溢出；
     touch-action:pan-y 让浏览器别把横滑当成「翻上一页」之类的系统手势。 */
  html,body{touch-action:pan-y;overflow-x:hidden}

  /* 切页时内容轻微淡入上浮（与导航指示器的弹簧同步） */
  /* 切页入场：从下方轻轻托上来，末尾带一点回弹，和导航胶囊的弹簧同时起跑 */
  #view.view-in{animation:viewIn .44s cubic-bezier(.34,1.42,.52,1) both}
  @keyframes viewIn{
    0%{opacity:0;transform:translateY(14px) scale(.985)}
    100%{opacity:1;transform:none}
  }

  /* ---------- 开屏封面（纯文字） ---------- */
  .cover{
    position:fixed;inset:0;z-index:1001;overflow:hidden;
    background:var(--cover-bg);
    display:flex;align-items:center;justify-content:center;
    transition:opacity .5s ease, transform .5s ease;
  }
  .cover[hidden]{display:none}
  .cover.out{opacity:0;transform:scale(1.035);pointer-events:none}
  .cover-brand{position:relative;z-index:1;text-align:center;animation:coverUp .92s cubic-bezier(.34,1.36,.5,1) both}
  .cover-mark{
    font-size:44px;font-weight:600;letter-spacing:.26em;text-indent:.26em;
    color:#1a2233;
  }
  .cover-tag{
    margin-top:15px;font-size:12px;letter-spacing:.4em;text-indent:.4em;
    color:#98a3b8;font-weight:500;
  }
  @keyframes coverUp{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}

  /* ---------- 启动闸门（设备激活） ---------- */
  body.lock-on{overflow:hidden}
  .lock{
    position:fixed;inset:0;z-index:999;
    display:flex;align-items:center;justify-content:center;padding:24px;
    /* 半透明遮罩，让底下的彩色背景透上来，激活卡才有东西可以「玻璃」 */
    background:rgba(234,242,255,.55);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    backdrop-filter:blur(30px) saturate(180%);
    transition:opacity .32s ease, transform .32s ease;
  }
  .lock[hidden]{display:none}
  .lock.out{opacity:0;transform:scale(1.05);pointer-events:none}
  .lock-card{
    width:100%;max-width:320px;text-align:center;
    padding:26px 20px;border-radius:28px;
    background:var(--glass);
    -webkit-backdrop-filter:var(--glass-blur);
    backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-line);
    box-shadow:var(--glass-hl), var(--glass-drop);
  }
  .lock-badge{
    width:58px;height:58px;margin:0 auto;border-radius:19px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#7aa2ff 0%,#3b6ef5 55%,#2b52c4 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 10px 24px rgba(59,110,245,.34);
  }
  .lock-badge svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .lock-title{font-size:18px;font-weight:800;letter-spacing:.5px;margin-top:16px}
  .lock-sub{font-size:12.5px;color:var(--muted);margin-top:5px}
  .lock-err{height:20px;line-height:20px;font-size:12.5px;font-weight:600;color:var(--bad);margin-top:12px}
  .lock.shake .lock-card{animation:lockShake .4s cubic-bezier(.36,.07,.19,.97)}
  @keyframes lockShake{
    10%,90%{transform:translateX(-2px)}
    30%,70%{transform:translateX(4px)}
    50%{transform:translateX(-7px)}
  }

  /* 激活面板 */
  .act-device{
    margin:20px auto 10px;padding:12px 16px;border-radius:16px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:20px;font-weight:700;letter-spacing:2.5px;color:#22304d;
    background:rgba(255,255,255,.55);
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 0 0 1px rgba(255,255,255,.7) inset, 0 6px 16px rgba(24,40,80,.08);
    user-select:text;-webkit-user-select:text;
  }
  .act-copy{margin-bottom:14px}
  .act-input{
    width:100%;margin-top:4px;padding:13px 14px;border-radius:14px;
    border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.48);
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:#2b3550;
    text-align:center;letter-spacing:.3px;
    resize:none;outline:none;
    box-shadow:0 1px 2px rgba(24,40,80,.05) inset;
    transition:border-color .18s, box-shadow .18s;
  }
  .act-input:focus{border-color:rgba(59,110,245,.65);box-shadow:0 0 0 4px rgba(59,110,245,.14)}
  .act-go{width:100%;margin-top:12px;padding:13px 16px;font-size:14.5px}
  .act-tip{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.7}

  /* 主面板：整页内容浮在背景上的一块玻璃 */
  .panel{
    background:var(--glass);
    -webkit-backdrop-filter:var(--glass-blur);
    backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-line);
    border-radius:var(--radius);
    box-shadow:var(--glass-hl), var(--glass-drop);
    padding:18px;
  }
  .panel + .panel{margin-top:14px}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .panel{background:rgba(255,255,255,.94)}
  }

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  /* 按钮：玻璃 + 果冻。按下 80ms 收紧，松开用带回弹的曲线放开 —— 这一下「弹」就是果冻感 */
  .btn{
    border:1px solid var(--glass-line);
    background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.4));
    -webkit-backdrop-filter:blur(12px) saturate(170%);
    backdrop-filter:blur(12px) saturate(170%);
    color:var(--text);font:inherit;font-size:13px;
    padding:7px 13px;border-radius:12px;cursor:pointer;white-space:nowrap;
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 2px 6px rgba(24,40,80,.07);
    transition:transform .34s var(--jelly-out), border-color .18s, color .18s, background .18s, box-shadow .18s;
  }
  .btn:hover{border-color:rgba(59,110,245,.55);color:var(--brand)}
  .btn:active{transform:scale(.94);transition-duration:.08s, .18s, .18s, .18s, .18s}
  .btn.primary{
    background:linear-gradient(180deg,#5a86ff,#3b6ef5 62%,#2f5fe0);
    border-color:rgba(255,255,255,.42);color:#fff;font-weight:600;
    box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 6px 16px rgba(59,110,245,.34);
  }
  .btn.primary:hover{background:linear-gradient(180deg,#4d7cff,#2f5fe0 62%,#2850c4);color:#fff}
  .btn.danger:hover{border-color:rgba(224,70,60,.6);color:var(--bad)}
  .btn:disabled{opacity:.42;cursor:not-allowed;border-color:var(--glass-line);color:var(--muted);background:rgba(255,255,255,.6);box-shadow:none;transform:none}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:10px}

  input[type=text],input[type=search],select{
    font:inherit;font-size:14px;color:var(--text);
    /* 玻璃上的输入框做成「内凹的槽」：比周围暗一点，才有按进去的感觉；
       用纯白会浮在面板上，像贴了一块纸。 */
    background:rgba(24,40,80,.05);
    border:1.5px solid rgba(255,255,255,.66);border-radius:12px;padding:8px 12px;outline:none;
    box-shadow:0 1px 3px rgba(24,40,80,.06) inset, 0 1px 0 rgba(255,255,255,.55);
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  input:focus,select:focus{border-color:rgba(59,110,245,.65);box-shadow:0 0 0 4px rgba(59,110,245,.14)}
  input[type=search]{flex:1;min-width:180px}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{
    border:1px solid var(--glass-line);
    background:rgba(255,255,255,.58);color:var(--muted);font:inherit;font-size:12px;
    padding:3px 9px;border-radius:99px;cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset;
    transition:transform .34s var(--jelly-out), border-color .18s, color .18s, background .18s;
  }
  .chip:hover{border-color:rgba(59,110,245,.5);color:var(--brand)}
  .chip:active{transform:scale(.93);transition-duration:.08s, .18s, .18s, .18s}
  .chip.on{
    background:linear-gradient(180deg,#5a86ff,#3b6ef5);border-color:rgba(255,255,255,.45);color:#fff;font-weight:600;
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 4px 12px rgba(59,110,245,.30);
  }

  /* 右上角「今日已复习 / 错词」胶囊 */
  .meta-pill{
    display:inline-flex;align-items:center;gap:7px;margin-left:auto;
    padding:3px 10px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.72));
    border:1px solid rgba(255,255,255,.95);
    box-shadow:0 1px 2px rgba(24,40,80,.06), 0 4px 12px rgba(24,40,80,.07), 0 0 0 1px #e4eaf4 inset;
    font-size:11px;font-weight:600;color:#63718f;letter-spacing:.2px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    -webkit-backdrop-filter:blur(6px) saturate(150%);backdrop-filter:blur(6px) saturate(150%);
    transition:.2s;
  }
  .meta-pill .mp-item{display:inline-flex;align-items:center;gap:4px}
  .meta-pill b{font-size:12px;font-weight:800;color:#16203a}
  .meta-pill b.mp-warn{color:var(--bad)}
  .meta-pill b.mp-zero{color:#9aa7bf}
  .meta-pill .mp-sep{width:1px;height:10px;background:#dde4f0;flex:none}
  /* 今日有新复习动作时，胶囊轻亮一下 */
  .meta-pill.mp-hot{border-color:rgba(59,110,245,.35);box-shadow:0 1px 2px rgba(24,40,80,.06),0 0 0 3px rgba(59,110,245,.10),0 0 0 1px #e4eaf4 inset}

  /* ---------- 词表 ---------- */
  .row{
    display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;
    padding:11px 12px;border-radius:16px;border:1px solid transparent;transition:.12s;
  }
  .row + .row{border-top:1px solid rgba(24,40,80,.055);border-top-left-radius:0;border-top-right-radius:0}
  /* 按住/点过这一行时的反馈底色。原来是 #f8faff，在白底上几乎看不出来；
     改成半透明品牌蓝，浓度要压过「重点」标签的 --brand-soft(#eaf0ff) 一档，
     否则标签会陷进行底色里。
     浮起来就是独立的一块，四角都该是圆的 —— 所以这条必须写在 .row + .row 之后，
     同特异性下后写的才盖得住那个 0。 */
  .row:hover{
    background:rgba(59,110,245,.15);
    border-color:rgba(59,110,245,.26);
    border-radius:16px;
  }
  .wline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .word{font-size:16.5px;font-weight:700;letter-spacing:.2px}
  .ph{font-size:12px;color:var(--muted);font-family:"Segoe UI",system-ui,sans-serif}
  .pos{font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:1px 6px;border-radius:6px}
  .cn{font-size:14px;color:#39445c;margin-top:2px}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .tagchips{display:flex;gap:6px;flex-shrink:0}
  /* 话题 chip 有 8 个，300px 的行宽一行只放得下 5 个 —— 原来靠横向滚动，
     结果最后两三个（城市/工作/学术）永远藏在屏幕外，看着像「没做完」。
     改成换行铺两排：8 个全在视野里，代价只是多 30px 高度。 */
  .tagchips.scroll{width:100%;flex-wrap:wrap;row-gap:6px;padding-bottom:1px}
  .tagchips.scroll .chip{flex:0 0 auto}
  .tagchips .chip{padding:6px 13px;border-radius:99px}
  .tag.t1{background:var(--bad-soft);color:var(--bad)}
  .tag.tok{background:var(--ok-soft);color:var(--ok)}
  .tag.t2{background:var(--brand-soft);color:var(--brand)}
  .tag.t3{background:#f1f4fa;color:var(--muted)}
  .rowacts{display:flex;align-items:center;gap:5px}
  /* 行内小按钮：词库页一次能有 300 个，绝对不能上 backdrop-filter，
     只做「半透明 + 内侧高光」的玻璃暗示，按压给果冻回弹。 */
  .sbtn{
    width:28px;height:28px;border-radius:10px;
    border:1px solid rgba(255,255,255,.9);
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.62));
    font:inherit;font-size:13px;line-height:1;cursor:pointer;color:var(--muted);
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 1px 3px rgba(24,40,80,.08);
    transition:transform .34s var(--jelly-out), border-color .15s, color .15s, background .15s;
  }
  .sbtn:hover{border-color:rgba(59,110,245,.6);color:var(--brand)}
  .sbtn:active{transform:scale(.88);transition-duration:.08s, .15s, .15s, .15s}
  .sbtn.s1.on{
    background:linear-gradient(180deg,#f2665c,#e0463c);border-color:rgba(255,255,255,.5);color:#fff;
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 4px 10px rgba(224,70,60,.35);
  }
  .sbtn.s3.on{
    background:linear-gradient(180deg,#2fb87e,#12a06a);border-color:rgba(255,255,255,.5);color:#fff;
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 4px 10px rgba(18,160,106,.35);
  }
  /* 学习状态底色改成半透明，压在玻璃面板上才透得出来（写死 #fff8f7 会变成一块白斑） */
  .row.st3{background:rgba(18,160,106,.08)}
  .row.st1{background:rgba(224,70,60,.07)}
  .empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:14px}
  .empty .big{font-size:34px;margin-bottom:8px}

  /* ---------- 闪卡 ---------- */
  .deck{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .fc{perspective:1400px;margin:6px 0 14px}
  /* 翻面用带回弹的曲线：转到 180° 会稍微冲过头再退回来，卡片像一块被弹开的果冻 */
  .fc-inner{position:relative;width:100%;min-height:270px;transition:transform .52s cubic-bezier(.34,1.28,.48,1);transform-style:preserve-3d;cursor:pointer}
  .fc.flip .fc-inner{transform:rotateY(180deg)}
  /* 卡面不用 backdrop-filter：它会新建一层，和 preserve-3d / backface-visibility 打架，
     翻面时容易闪。改用「半透明 + 强内侧高光 + 大投影」把玻璃感画出来。 */
  .fc-face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border:1px solid var(--glass-line);border-radius:24px;
    background:linear-gradient(160deg,rgba(255,255,255,.66) 0%,rgba(255,255,255,.34) 100%);
    box-shadow:var(--glass-hl), 0 18px 40px rgba(24,40,80,.14), 0 2px 8px rgba(24,40,80,.06);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px;text-align:center;
  }
  .fc-back{
    transform:rotateY(180deg);
    background:linear-gradient(160deg,rgba(248,251,255,.74) 0%,rgba(226,238,255,.44) 100%);
  }
  .fc-word{font-size:40px;font-weight:800;letter-spacing:.5px;word-break:break-word}
  .fc-ph{font-size:15px;color:var(--muted)}
  .fc-pos{font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:2px 10px;border-radius:99px}
  .fc-cn{font-size:22px;font-weight:600;line-height:1.7}
  .fc-hint{font-size:12.5px;color:var(--muted);margin-top:4px}
  .fc-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .fc-acts .btn{padding:10px 20px;font-size:14px;border-radius:12px}
  .fc-acts .b1:hover{border-color:var(--bad);color:var(--bad)}
  .fc-acts .b3:hover{border-color:var(--ok);color:var(--ok)}

  /* ---------- 闪卡下方：掌握进度长条（长椭圆形 · 动态提示） ---------- */
  .fc-prog{margin:16px 0 2px;user-select:none;-webkit-user-select:none}
  .fc-prog .fp-track{
    position:relative;height:18px;border-radius:999px;overflow:hidden;
    background:linear-gradient(180deg,rgba(24,40,80,.07),rgba(24,40,80,.035));
    box-shadow:0 1px 1px rgba(255,255,255,.8) inset, 0 1px 3px rgba(24,40,80,.05) inset;
  }
  /* 进度填充：宽度随掌握数增长；渐变持续流动 + 顶部高光，像一段会走的液体 */
  .fc-prog .fp-fill{
    position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;
    background:linear-gradient(90deg,#8fb4ff 0%,#5b8bff 45%,#3b6ef5 100%);
    background-size:220% 100%;
    box-shadow:0 0 14px rgba(59,110,245,.42);
    transition:width .8s cubic-bezier(.22,.9,.24,1);
    animation:fpFlow 4s linear infinite;
  }
  .fc-prog .fp-fill::before{
    content:"";position:absolute;left:0;right:0;top:0;height:48%;border-radius:999px 999px 0 0;
    background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,0));
  }
  @keyframes fpFlow{0%{background-position:0% 50%}100%{background-position:220% 50%}}
  /* 光带循环扫过：提示「这里在记录进度」 */
  .fc-prog .fp-track::after{
    content:"";position:absolute;top:0;bottom:0;left:0;width:30%;pointer-events:none;
    background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(255,255,255,0));
    animation:fpShine 3.1s ease-in-out infinite;
  }
  @keyframes fpShine{0%{transform:translateX(-140%)}62%,100%{transform:translateX(360%)}}
  .fc-prog .fp-fill.min{min-width:14px}
  /* 刚评分完（掌握数+1）时，长条轻微亮一下，强化「在增长」的反馈 */
  .fc-prog.bump .fp-track{animation:fpBump .7s ease}
  @keyframes fpBump{
    0%{box-shadow:0 0 0 1px #e2e9f5 inset, 0 1px 3px rgba(24,40,80,.07) inset}
    38%{box-shadow:0 0 0 1px #c9daff inset, 0 0 16px rgba(59,110,245,.38)}
    100%{box-shadow:0 0 0 1px #e2e9f5 inset, 0 1px 3px rgba(24,40,80,.07) inset}
  }
  .fc-prog.bump .fp-pct{animation:fpPop .7s cubic-bezier(.3,1.4,.4,1)}
  @keyframes fpPop{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
  /* 长条下方的说明行 */
  .fc-prog .fp-meta{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:9px;padding:0 3px;
    font-size:12px;font-weight:600;color:#5a6a8c;
    font-variant-numeric:tabular-nums;letter-spacing:.2px;
  }
  .fc-prog .fp-meta b{font-size:12.5px;font-weight:800;color:#16203a}
  .fc-prog .fp-meta .fp-right{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .fc-prog .fp-meta .fp-rest{color:#8593b0}
  .fc-prog .fp-meta .fp-pct{
    color:#2b5bd7;font-weight:800;
    background:#eaf1ff;border-radius:999px;padding:1px 8px;
  }

  /* ---------- 测验 ---------- */
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .qchip{
    font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;
    background:rgba(255,255,255,.62);color:var(--muted);
    border:1px solid rgba(255,255,255,.85);box-shadow:0 1px 0 rgba(255,255,255,.9) inset;
  }
  .qchip.ok{background:rgba(18,160,106,.13);border-color:rgba(18,160,106,.28);color:var(--ok)}
  .qchip.bad{background:rgba(224,70,60,.11);border-color:rgba(224,70,60,.26);color:var(--bad)}
  .qtext{font-size:26px;font-weight:700;margin:8px 0 6px;line-height:1.5;text-align:center;word-break:break-word}
  .qtext.small{font-size:19px;font-weight:600}
  /* 例句：只给「英→中」模式用。斜体 + 淡色，压在单词下面当语境，
     不抢题干；目标词（含 -ed/-ing/-s 这类变形）加粗提一点色，方便一眼扫到。 */
  .qeg{
    font-size:14.5px;line-height:1.65;color:var(--muted);
    font-style:italic;text-align:center;
    margin:2px auto 14px;max-width:34em;padding:0 6px;
  }
  .qeg b{font-style:normal;font-weight:700;color:var(--text)}
  /* 「我的」页底部的一行数据来源署名，CC-BY 要求标出来 */
  .srcnote{font-size:11.5px;color:var(--muted);opacity:.75;margin-top:18px;text-align:center;line-height:1.7}
  .qsub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:20px}
  .opts{display:flex;flex-direction:column;gap:10px}
  /* 选项：一页只有 4 个，可以上真玻璃。按下去像按一颗果冻 */
  .opt{
    display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    border:1.5px solid var(--glass-line);
    background:linear-gradient(180deg,rgba(255,255,255,.64),rgba(255,255,255,.38));
    -webkit-backdrop-filter:blur(14px) saturate(170%);
    backdrop-filter:blur(14px) saturate(170%);
    color:var(--text);font:inherit;font-size:15.5px;padding:13px 15px;border-radius:16px;cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 3px 10px rgba(24,40,80,.06);
    transition:transform .34s var(--jelly-out), border-color .18s, background .18s, box-shadow .18s;
  }
  .opt:hover:not(.locked){border-color:rgba(59,110,245,.5);background:rgba(255,255,255,.86)}
  .opt:active:not(.locked){transform:scale(.975);transition-duration:.08s, .18s, .18s, .18s}
  .opt .key{
    flex:0 0 26px;height:26px;border-radius:9px;
    background:rgba(255,255,255,.85);color:var(--muted);
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 1px 3px rgba(24,40,80,.08);
    font-size:13px;font-weight:700;display:grid;place-items:center;
  }
  .opt .txt{flex:1;padding-top:1px}
  .opt.locked{cursor:default}
  .opt.correct{border-color:rgba(18,160,106,.75);background:rgba(18,160,106,.13);box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 4px 14px rgba(18,160,106,.16)}
  .opt.correct .key{background:linear-gradient(180deg,#2fb87e,#12a06a);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
  .opt.wrong{border-color:rgba(224,70,60,.75);background:rgba(224,70,60,.11);box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 4px 14px rgba(224,70,60,.16)}
  .opt.wrong .key{background:linear-gradient(180deg,#f2665c,#e0463c);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
  .opt.dim{opacity:.55}
  /* 判定出来的那一下弹一下，比单纯变色有反馈感 */
  .opt.correct{animation:optPop .46s cubic-bezier(.34,1.5,.6,1)}
  .opt.wrong{animation:optPop .46s cubic-bezier(.34,1.5,.6,1)}
  @keyframes optPop{0%{transform:scale(1)}38%{transform:scale(1.025)}100%{transform:scale(1)}}
  .spellbox{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
  .spellbox input{font-size:20px;text-align:center;letter-spacing:2px;padding:12px 16px;min-width:280px}
  /* 解析块：出现时带一点果冻弹出，不是干巴巴地淡入 */
  .explain{
    margin-top:16px;border-left:3px solid var(--brand);
    background:linear-gradient(165deg,rgba(255,255,255,.8),rgba(238,245,255,.6));
    border-radius:6px 16px 16px 6px;padding:13px 16px;font-size:14.5px;color:#39445c;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 6px 18px rgba(24,40,80,.07);
    animation:fade .42s cubic-bezier(.34,1.5,.6,1) both;
  }
  .explain b{color:var(--brand)}
  .explain .verdict{display:block;font-weight:700;margin-bottom:5px;font-size:14px}
  .explain .verdict.ok{color:var(--ok)}
  .explain .verdict.no{color:var(--bad)}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  /* ---------- 统计 ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
  .stat{
    background:linear-gradient(165deg,rgba(255,255,255,.62),rgba(255,255,255,.36));
    border:1px solid var(--glass-line);border-radius:18px;padding:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 6px 18px rgba(24,40,80,.07);
  }
  .stat .n{font-size:26px;font-weight:800;line-height:1.2}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:2px}
  .stat.ok .n{color:var(--ok)} .stat.bad .n{color:var(--bad)} .stat.brand .n{color:var(--brand)}
  .lettbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 18px}
  .lettbars.tags{grid-template-columns:1fr;gap:10px}
  .lettbars.tags .k{width:auto;line-height:1}
  .lettbars.tags .v{width:70px}
  .lb{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .lb .k{width:14px;font-weight:700;color:var(--muted)}
  .lb .t{flex:1;height:6px;background:rgba(24,40,80,.08);border-radius:99px;overflow:hidden;box-shadow:0 1px 1px rgba(255,255,255,.7) inset}
  .lb .t i{display:block;height:100%;background:linear-gradient(90deg,#8fb0ff,#3b6ef5);border-radius:99px}
  .lb .v{width:52px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .sect{font-size:14px;font-weight:700;margin:20px 0 10px}

  /* ---------- 「我的」页 ---------- */
  .me-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .me-avatar{
    width:54px;height:54px;flex:none;border-radius:17px;
    background:linear-gradient(145deg,#6f9bff 0%,#3b6ef5 58%,#2c53c6 100%);
    color:#fff;font-size:21px;font-weight:800;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px rgba(59,110,245,.30), 0 1px 0 rgba(255,255,255,.55) inset;
  }
  .me-info{flex:1;min-width:0}
  .me-name{font-size:16px;font-weight:700}
  .me-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .me-bar{height:7px;border-radius:99px;background:#e9edf7;margin-top:9px;overflow:hidden}
  .me-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8fb0ff,#3b6ef5);transition:width .35s}
  .me-danger{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .me-danger .tip{font-size:12.5px;color:var(--muted);line-height:1.6}

  .toast{
    position:fixed;left:50%;bottom:calc(104px + var(--nav-lift,0px) + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:rgba(28,36,52,.80);
    -webkit-backdrop-filter:blur(16px) saturate(170%);
    backdrop-filter:blur(16px) saturate(170%);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;font-size:13.5px;padding:9px 18px;border-radius:99px;
    box-shadow:0 1px 0 rgba(255,255,255,.14) inset, 0 10px 28px rgba(24,40,80,.30);z-index:99;
    /* 弹出来的时候冲过头再落定 */
    transition:opacity .26s ease, transform .4s var(--jelly-out);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .kbd{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:#fafbff}
  /* ---------- iPad / 平板（视口 ≥700px）----------
     页面是按 390px 手机排的，iPad Air 5 竖屏 CSS 宽是 820px。不收窄的话词库每行
     近 790px，一行字太长反而难扫读，底部导航胶囊也会被拉成一根长条。收窄居中后
     观感接近「大号手机」，横屏 1180px 同样适用。 */
  @media (min-width:700px){
    body{
      padding-left:calc(28px + env(safe-area-inset-left,0px));
      padding-right:calc(28px + env(safe-area-inset-right,0px));
    }
    .wrap{max-width:740px}
    .tabs{max-width:440px}
    /* 大屏上闪卡与题干可以更醒目，否则四周会显得空。
       卡面高度跟着视口走：竖屏 1180 时约 448px，横屏 820 时约 312px，
       不会因为固定值在横屏被顶出屏幕。 */
    .fc-word{font-size:52px}
    .fc-cn{font-size:26px}
    .fc-inner{min-height:clamp(270px,38vh,460px)}
    .qtext{font-size:30px}
    .qeg{font-size:17px;max-width:30em}
  }
  @media (max-width:620px){
    .row{grid-template-columns:1fr}
    .rowacts{justify-content:flex-start}
    .fc-word{font-size:32px}
    .qtext{font-size:22px}
    /* 悬浮胶囊：移动端保持左右留白，不贴边；内边距仍为 4px（选中块 56px） */
    .tabs{gap:1px;padding:4px;border-radius:999px;height:64px}
    .tabs .nav-lens{top:4px;bottom:4px}
    .tabs button{flex:1 1 0;min-width:0;font-size:10.5px;padding:6px 1px 5px;gap:2px}
    .tabs button svg{width:20px;height:20px}
    /* 筛选胶囊（测验页）：加大触控目标 */
    .chips{gap:6px}
    .chips .chip{padding:7px 12px;font-size:13.5px}
    /* 工具栏控件换行铺满，便于点按 */
    .toolbar{gap:8px}
    .toolbar input[type=search]{flex:1 1 100%;min-width:0}
    .toolbar select{flex:1 1 calc(50% - 4px);min-width:0}
    /* 词条操作按钮加大到触控尺寸 */
    .sbtn{width:40px;height:40px;border-radius:11px;font-size:15px}
    .rowacts{gap:8px}
    /* 闪卡评分按钮：一行放下三个，加大触控高度 */
    .fc-acts{flex-wrap:nowrap;gap:7px}
    .fc-acts .btn{flex:1 1 0;min-width:0;padding:13px 4px;font-size:13.5px;white-space:nowrap}
    .fc-acts .kbd{display:none}
    /* 闪卡下方进度长条：移动端略收窄 */
    .fc-prog{margin-top:14px}
    .fc-prog .fp-track{height:16px}
    .fc-prog .fp-meta{font-size:11.5px;margin-top:8px}
    .fc-prog .fp-meta b{font-size:12px}
    header.top{gap:10px}
  }
</style>
</head>

  { id:"cet6",  pill:"CET6", cn:"六", name:"六级备考中", ls:"cet6-3000-v1",  words:[] },
  { id:"ielts", pill:"雅思", cn:"雅", name:"雅思备考中", ls:"ielts-3000-v1", words:IELTS_WORDS }
];
const BANK_LS = "cet4-bank-v1";
const LEVEL = {1:"不认识",3:"已掌握"};

let bankId = "cet4";
let LS = BANKS[0].ls;
let W = [], BY_WORD = new Map(), LETTERS = [];
let store = { st:{}, wr:{}, seen:{}, days:{} };

function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw){ const o = JSON.parse(raw); store = Object.assign(store, o); }
  }catch(e){}
  store.st = store.st || {}; store.wr = store.wr || {}; store.seen = store.seen || {}; store.days = store.days || {};
  /* 一次性迁移：等级已从三档（不认识/模糊/已掌握）收敛为两档，
     旧的「模糊」(2) 统一并入「不认识」(1)，否则这批词会卡在没有按钮可改的中间态。 */
  let migrated = false;
  for(const k in store.st){
    if(store.st[k] === 2){ store.st[k] = 1; migrated = true; }
  }
  if(migrated) save();
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} }

const todayKey = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function touchDay(){ const k = todayKey(); store.days[k] = (store.days[k]||0) + 1; }
function mark(word, lv){
  store.st[word] = lv;
  store.seen[word] = (store.seen[word]||0) + 1;
  touchDay(); save(); paintHeader();
}
function markWrong(word){ store.wr[word] = (store.wr[word]||0) + 1; save(); }
function unmark(word){ delete store.st[word]; save(); paintHeader(); }

/* ==================== 数据索引 ==================== */
const buildIndex = list => list.map(a => ({ w:a[0], ph:a[1], pos:a[2], cn:a[3], tag:a[4], tp:a[5]||"", eg:a[6]||"", l:a[0][0].toUpperCase() }));

/* 例句里的目标词高亮：句子里出现的是 abandoned / abandoning 这类变形，
   所以连常见后缀一起认。词本身可能带 - 或 . ，进正则前要转义。 */
const EG_SUF = "(?:s|es|ed|d|ing|ly|er|est|ies|ied)?";
function egHTML(eg, w){
  const plain = esc(eg);
  if(!w) return plain;
  try{
    const re = new RegExp("\\b(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + EG_SUF + ")\\b", "i");
    return plain.replace(re, "<b>$1</b>");
  }catch(e){ return plain; }
}
/* 话题标签（只对雅思库有意义：CET4 词表没有第 6 列）。顺序就是词库里 chip 的显示顺序 */
const TOPIC_ORDER = ["教育","环境","科技","健康","城市","工作","学术"];
/* 标签只分两级：重点 = 原来的「高频」+「核心」，次要 = 原来的「一般」 */
const TAGS = ["重点","次要"];
const LIB_TAGS = TAGS;

/* 切换词库：重建索引、换存储 key、清掉各页面的临时状态 */
function applyBank(id){
  const b = BANKS.find(x => x.id === id) || BANKS[0];
  bankId = b.id;
  LS = b.ls;
  W = buildIndex(b.words);
  BY_WORD = new Map(W.map(x => [x.w, x]));
  LETTERS = [...new Set(W.map(x => x.l))].sort();
  store = { st:{}, wr:{}, seen:{}, days:{} };
  load();
  libState.q=""; libState.tag="ALL"; libState.tp="ALL"; libState.status="NEW"; libState.shown=150; libList=[];
  cardState.scope="NEW"; cardState.queue=[]; cardState.i=0; cardState.flipped=false; cardState.queueScope=null;
  quiz.running=false; quiz.list=[]; quiz.i=0; quiz.cur=null;
  try{ localStorage.setItem(BANK_LS, b.id); }catch(e){}
  paintBrand();
}

function paintBrand(){
  const b = BANKS.find(x => x.id === bankId) || BANKS[0];
  const t = $("#brandText"); if(t) t.textContent = b.pill;
  $$("#bankPop .bank-chip").forEach(c => c.classList.toggle("on", c.dataset.bank === bankId));
}

/* ---------- 品牌胶囊 → 三颗小胶囊 ---------- */
function openBankPop(){
  const pop = $("#bankPop"), btn = $("#brandBtn");
  if(!pop || !btn) return;
  paintBrand();
  pop.hidden = false;
  btn.setAttribute("aria-expanded", "true");
  if(!$("#bankMask")){
    const m = document.createElement("div");
    m.className = "bank-mask"; m.id = "bankMask";
    m.addEventListener("click", closeBankPop);
    document.body.appendChild(m);
  }
}
function closeBankPop(){
  const pop = $("#bankPop"), btn = $("#brandBtn");
  if(pop) pop.hidden = true;
  if(btn) btn.setAttribute("aria-expanded", "false");
  const m = $("#bankMask"); if(m) m.remove();
}

/* 真正执行切换：换库 + 重画整页 */
function switchBank(id){
  const b = BANKS.find(x => x.id === id) || BANKS[0];
  closeBankPop();
  if(b.id === bankId) return;
  applyBank(b.id);
  paintHeader();
  render();
  navSlide(false);
  toast(b.words.length ? ("已切换到 " + b.pill + " 词库") : (b.pill + " 词库待导入"));
}

const lv = w => store.st[w] || 0;
const wrongCount = w => store.wr[w] || 0;
const isWrong = w => wrongCount(w) > 0;

function counts(){
  let m=0, bad=0, unseen=0;
  for(const x of W){
    const l = lv(x.w);
    if(l===3) m++; else if(l===1) bad++; else unseen++;
  }
  return {total:W.length, mastered:m, weak:bad, unseen, done:m+bad, wrong:W.filter(x=>isWrong(x.w)).length};
}

/* ==================== 工具 ==================== */
/* 用 let：渲染邻页缓存时要临时把它指向一个游离容器，避免绑到正身上 */
let $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const tagCls = t => t==="重点" ? "t2" : "t3";

let toastTimer=null;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1600); }

/* ==================== 顶部状态 ==================== */
function paintHeader(){
  const c = counts();
  const td = store.days[todayKey()] || 0;
  const mr = $("#metaRight");
  mr.innerHTML =
      '<span class="mp-item">今日已复习 <b class="' + (td > 0 ? "" : "mp-zero") + '">' + td + '</b> 次</span>'
    + '<i class="mp-sep"></i>'
    + '<span class="mp-item">错词 <b class="' + (c.wrong > 0 ? "mp-warn" : "mp-zero") + '">' + c.wrong + '</b> 个</span>';
  mr.classList.toggle("mp-hot", td > 0);
  paintCardProgress();
}

/* 闪卡下方的长椭圆进度长条：随掌握数实时增长 */
let _fpLast = null;
function paintCardProgress(){
  const bar = $("#fcprog"); if(!bar) return;
  const c = counts();
  const pct = c.total ? (c.mastered / c.total * 100) : 0;
  const fill = $("#fpFill");
  if(fill){
    fill.style.width = pct.toFixed(2) + "%";
    fill.classList.toggle("min", pct > 0 && pct < 0.4);
  }
  const n = $("#fpNum"); if(n) n.textContent = c.mastered;
  const t = $("#fpTotal"); if(t) t.textContent = c.total;
  const rest = $("#fpRest");
  if(rest) rest.textContent = c.mastered >= c.total ? "全部掌握" : ("还差 " + (c.total - c.mastered) + " 词");
  const p = $("#fpPct"); if(p) p.textContent = pct.toFixed(1) + "%";
  bar.setAttribute("title", "已掌握 " + c.mastered + " / " + c.total + "（" + pct.toFixed(1) + "%）· 剩余 " + (c.total - c.mastered) + " 词");
  // 掌握数增加时让长条亮一下（评分反馈）
  if(_fpLast !== null && c.mastered > _fpLast){
    bar.classList.remove("bump"); void bar.offsetWidth; bar.classList.add("bump");
    clearTimeout(paintCardProgress._t);
    paintCardProgress._t = setTimeout(() => bar.classList.remove("bump"), 720);
  }
  _fpLast = c.mastered;
}

/* ==================== 底部导航：液态玻璃指示器 ====================
   思路对应 AndroidLiquidGlass 的 LiquidBottomTabs：
   - 指示器位置由弹簧驱动（不用 CSS 缓动），切换时带一丝回弹
   - 按瞬时速度做「横向拉伸 + 纵向压扁」；拉伸原点偏向「来向」，
     前缘被甩出去 —— 这才是液体的样子，居中缩放只会变成「胖了一圈」
   - 定步长积分：60Hz / 120Hz / 掉一帧，轨迹都一致，不会抖也不会炸
   - 切换时整条玻璃做一次很小的侧移回弹（panelOffset）
   ================================================================ */
const navS = { x:0, v:0, target:0, raf:0, last:0, ready:false };

function navMetrics(){
  const bar = $("#tabs"), lens = $("#navLens");
  if(!bar || !lens) return null;
  const btns = $$("#tabs button");
  if(!btns.length) return null;
  const br = bar.getBoundingClientRect();
  let idx = btns.findIndex(b => b.classList.contains("on"));
  if(idx < 0) idx = 0;
  const rr = btns[idx].getBoundingClientRect();
  // 指示器 left:0 落在 border 内侧，故减掉 1px 边框
  return { x: rr.left - br.left - 1, w: rr.width, idx };
}

/* 只写 CSS 变量、不读任何布局 —— 拖动时每帧都要走这里，读一次布局就够卡了。
   胶囊节点由调用方传进来（拖动中会缓存住），省掉每帧的 querySelector。 */
function navPaint(lens){
  if(!lens) return;
  /* 速度软归一化：v / (|v| + 2100)，单调趋近 ±1。
     以前是硬夹断，跨一格和跨四格会顶到同一个上限、快慢分不出来；
     软归一化之后小跳轻拉、大跳重拉，是连续过渡的。 */
  const v = navS.v;
  const vn = v / (Math.abs(v) + 2100);
  /* 拉伸原点往「来向」偏：向右甩 → 原点靠左 → 前缘（右边）被拉出去 */
  const lead = 50 - vn * 34;
  const sx = Math.max(0.86, 1 / (1 - vn * 0.38));
  const sy = Math.max(0.90, 1 - Math.abs(vn) * 0.15);
  /* 行进中点亮高光（0→1），停下自动落回去 —— 玻璃被甩动时扫过一道光 */
  const travel = Math.min(1, Math.abs(vn) * 2);
  lens.style.setProperty("--tx", navS.x.toFixed(2) + "px");
  lens.style.setProperty("--sx", sx.toFixed(3));
  lens.style.setProperty("--sy", sy.toFixed(3));
  lens.style.setProperty("--lead", lead.toFixed(1) + "%");
  lens.style.setProperty("--press", travel.toFixed(2));
}
function navApply(){ navPaint($("#navLens")); }

function navTick(now){
  let dt = (now - navS.last) / 1000;
  navS.last = now;
  if(!(dt > 0)) dt = 1 / 60;
  dt = Math.min(dt, 0.05);                 // 从后台切回来时别一次跳完
  /* ω≈23.7、ζ≈0.73：约 150ms 就到位、350ms 完全停稳，只留 2.6% 回弹。
     定步长 1/240 积分，帧率变化不影响轨迹。 */
  const k = 560, c = 34.5, STEP = 1 / 240;
  let left = dt;
  while(left > 0){
    const h = Math.min(STEP, left); left -= h;
    navS.v += (-k * (navS.x - navS.target) - c * navS.v) * h;
    navS.x += navS.v * h;
  }
  if(Math.abs(navS.v) < 3 && Math.abs(navS.x - navS.target) < 0.35){
    navS.x = navS.target; navS.v = 0; navApply();
    const bar = $("#tabs"); if(bar) bar.classList.remove("moving");
    clearTimeout(navS.guard);
    navS.raf = 0; return;
  }
  navApply();
  navS.raf = requestAnimationFrame(navTick);
}

function navSlide(animate){
  const m = navMetrics(); if(!m) return;
  const lens = $("#navLens");
  lens.style.width = m.w.toFixed(2) + "px";
  navS.target = m.x;
  if(!animate || !navS.ready){
    navS.x = m.x; navS.v = 0; navS.ready = true; navApply(); return;
  }
  /* 动画还在跑时再点别的标签：只换目标、保留速度，胶囊会自然拐弯过去 */
  const bar = $("#tabs"); if(bar) bar.classList.add("moving");
  if(!navS.raf){ navS.last = performance.now(); navS.raf = requestAnimationFrame(navTick); }
  /* 兜底：WebView 切后台时 rAF 会停，胶囊不能永远卡在两格之间 */
  clearTimeout(navS.guard);
  navS.guard = setTimeout(() => {
    if(!navS.raf) return;
    cancelAnimationFrame(navS.raf); navS.raf = 0;
    navS.x = navS.target; navS.v = 0; navApply();
    const b = $("#tabs"); if(b) b.classList.remove("moving");
  }, 700);
}

/* ---------- panelOffset：整条 bar 的侧移回弹（spring(1f, 300f, 0.5f)） ----------
   库里 panelOffset = 4dp * fraction.sign * EaseOut(|fraction|)，
   松手后再用弹簧把整条 bar 拉回原位；这里用「速度脉冲 + 弹簧」等价表达：
   给弹簧一个与切换方向同向的初速度，峰值位移 ≈ 4px，随后自然回弹一次。 */
const navP = { x:0, v:0, raf:0, last:0 };
function navPanelTick(now){
  const dt = Math.min(Math.max((now - navP.last) / 1000, 0.008), 0.032);
  navP.last = now;
  const k = 300, c = 17.32;                 // ω=√300≈17.32，ζ=0.5
  navP.v += (-k * navP.x - c * navP.v) * dt;
  navP.x += navP.v * dt;
  if(Math.abs(navP.x) < 0.03 && Math.abs(navP.v) < 0.6){
    navP.x = 0; navP.v = 0; navP.raf = 0;
    $("#tabs").style.setProperty("--nav-shift", "0px");
    return;
  }
  $("#tabs").style.setProperty("--nav-shift", navP.x.toFixed(2) + "px");
  navP.raf = requestAnimationFrame(navPanelTick);
}
function navSway(dir){
  if(!dir) return;
  navP.v += dir * 125;                      // 速度脉冲：峰值 ≈ 4px
  if(!navP.raf){ navP.last = performance.now(); navP.raf = requestAnimationFrame(navPanelTick); }
}
/* ==================== 导航栏拖拽：按住胶囊左右滑 ====================
   只在导航栏这一条里响应（`touch-action:none` 已经把这块从页面滚动里摘出来）。
   内容不跟手 —— 拖的时候只有胶囊在走，松手才换页。

   要做到不卡，靠三条：
     1. 按下瞬间把五个格子的位置量一次存起来，之后全程不再读布局；
     2. 每帧只写 5 个 CSS 变量，不碰 DOM 结构、不重新渲染页面；
     3. 胶囊节点、按钮数组都提前缓存，pointermove 里没有一次查询。
   手指位移和一格宽度严格 1:1，所以胶囊是「贴着手指走」而不是「追着跑」。 */
const DR = {
  id:null, on:false,
  x0:0, f:0, f0:0, baseIdx:0, step:74,
  v:0, lastX:0, lastT:0,
  slots:null, btns:null, lens:null, n:0, mark:-1,
  suppressClick:0
};

function drSlots(){
  const bar = $("#tabs"), btns = $$("#tabs button");
  if(!bar || btns.length < 2) return null;
  const br = bar.getBoundingClientRect();
  return btns.map(b => {
    const r = b.getBoundingClientRect();
    return { x: r.left - br.left - 1, tab: b.dataset.tab };
  });
}
/* 连续下标 → 胶囊 left（0 = 第一格，可小数） */
function drLensAt(fi){
  const s = DR.slots; if(!s) return 0;
  const c = Math.max(0, Math.min(s.length - 1, fi));
  const i0 = Math.floor(c), i1 = Math.min(s.length - 1, i0 + 1), k = c - i0;
  return s[i0].x + (s[i1].x - s[i0].x) * k;
}
/* 标签高亮跟着胶囊交班：跨过半格就换人 */
function drMark(idx){
  if(idx === DR.mark) return;
  DR.mark = idx;
  const bs = DR.btns; if(!bs) return;
  for(let i = 0; i < bs.length; i++) bs[i].classList.toggle("on", i === idx);
}

function drDown(e){
  if(DR.id !== null) return;                        // 只跟第一根手指
  if(e.pointerType === "mouse" && e.button !== 0) return;
  const slots = drSlots(); if(!slots) return;
  const bar = $("#tabs"), btns = $$("#tabs button");
  const on = btns.findIndex(b => b.classList.contains("on"));
  const bi = on < 0 ? 0 : on;
  DR.id = e.pointerId;
  DR.on = false;
  DR.slots = slots; DR.btns = btns; DR.n = slots.length;
  DR.lens = $("#navLens");
  DR.baseIdx = bi; DR.mark = bi;
  DR.step = Math.max(28, btns[bi].getBoundingClientRect().width);
  DR.x0 = e.clientX; DR.f = 0; DR.f0 = 0;
  DR.v = 0; DR.lastX = e.clientX; DR.lastT = performance.now();
  try{ bar.setPointerCapture(e.pointerId); }catch(err){}
}

function drMove(e){
  if(DR.id !== e.pointerId) return;
  const dx = e.clientX - DR.x0;
  if(!DR.on){
    if(Math.abs(dx) < 5) return;                    // 5px 以内还算点击
    DR.on = true;
    const bar = $("#tabs");
    if(bar) bar.classList.add("dragging");
    /* 上一段弹簧可能还在跑：停掉它，把位置交还给手指。
       记下胶囊当前相对格子中心的偏移，接着从这儿走 —— 不然会先「啪」地
       吸到格子中心再跟手，那一下很跳。 */
    if(navS.raf){ cancelAnimationFrame(navS.raf); navS.raf = 0; }
    clearTimeout(navS.guard);
    DR.f0 = (navS.x - drLensAt(DR.baseIdx)) / DR.step;
    DR.mark = -1;
  }
  const now = performance.now();
  const dt = Math.max(now - DR.lastT, 8);
  DR.v = DR.v * 0.6 + ((e.clientX - DR.lastX) / dt * 1000) * 0.4;
  DR.lastX = e.clientX; DR.lastT = now;

  /* 一格的手指位移 = 一格宽度 → 胶囊严格跟手（f0 是抓起来时的偏移） */
  let f = DR.f0 + dx / DR.step;
  /* 首尾越界做阻尼：胶囊探出去一点就拽住 */
  const lo = -DR.baseIdx, hi = (DR.n - 1) - DR.baseIdx;
  if(f < lo) f = lo + (f - lo) * 0.22;
  if(f > hi) f = hi + (f - hi) * 0.22;
  DR.f = f;

  navS.x = drLensAt(DR.baseIdx + f);
  navS.v = DR.v;
  navPaint(DR.lens);
  if(DR.lens) DR.lens.style.setProperty("--press", "0.85");   // 拖着的时候一直是「拿起」状态
  drMark(Math.max(0, Math.min(DR.n - 1, Math.round(DR.baseIdx + f))));
}

function drUp(e){
  if(DR.id !== e.pointerId) return;
  const wasOn = DR.on, f = DR.f, v = DR.v, base = DR.baseIdx;
  DR.id = null; DR.on = false;
  const bar = $("#tabs");
  if(bar){
    bar.classList.remove("dragging");
    try{ bar.releasePointerCapture(e.pointerId); }catch(err){}
  }
  if(!wasOn) return;                                 // 只是点了一下，交给 click 处理

  DR.suppressClick = performance.now() + 450;

  /* 落点：位置为主，速度只在小幅拖动时说话。
     拖过半格之后就不再让速度插嘴 —— 否则「拖了两格 + 手上还有点速度」
     会被顶成三格，跟眼睛看到的对不上。 */
  const cur = base + f;
  let idx = Math.round(cur);
  /* 只有真的「甩」起来（>900px/s）才额外顶多半格；否则纯看位置。
     阈值压低到 250 试过，20px 的慢拖都会被判成翻页，太贼。 */
  if(Math.abs(f) < 0.5 && Math.abs(v) > 900){
    const push = 0.45 * Math.min(1, Math.abs(v) / 1400);
    idx = Math.round(cur + (v > 0 ? push : -push));
  }
  idx = Math.max(0, Math.min(DR.n - 1, idx));
  const target = DR.slots[idx] ? DR.slots[idx].tab : null;

  /* 把手指速度交给弹簧：它会接着这个劲儿冲过去，不会「断一下」再重新起步 */
  navS.x = drLensAt(base + f);
  navS.v = Math.max(-800, Math.min(800, v * 0.4));

  if(target && target !== tab){
    go(target);                                      // 内部会 render + navSlide(true)
  }else{
    drMark(base);
    navSlide(true);                                  // 没到阈值：弹回原格
  }
}

function drCancel(e){
  if(DR.id !== e.pointerId) return;
  DR.id = null;
  if(!DR.on) return;
  DR.on = false;
  const bar = $("#tabs");
  if(bar) bar.classList.remove("dragging");
  DR.suppressClick = performance.now() + 450;
  /* 不硬吸回去：位置留在原地，让弹簧自己走回原格 */
  drMark(DR.baseIdx);
  navS.v = 0;
  navSlide(true);
}

$("#tabs").addEventListener("pointerdown", drDown, { passive:true });
window.addEventListener("pointermove", drMove, { passive:true });
window.addEventListener("pointerup", drUp);
window.addEventListener("pointercancel", drCancel);
/* 长按导航栏不弹系统菜单 */
$("#tabs").addEventListener("contextmenu", e => e.preventDefault());
$("#tabs").addEventListener("dragstart", e => e.preventDefault());

/* ==================== 路由 ==================== */
let tab = "lib";
function go(t){
  const btns = $$("#tabs button");
  const prev = btns.findIndex(b => b.classList.contains("on"));
  tab = t;
  btns.forEach(b => b.classList.toggle("on", b.dataset.tab===t));
  render();
  const next = btns.findIndex(b => b.classList.contains("on"));
  navSlide(true);
  if(prev >= 0 && next >= 0 && prev !== next) navSway(Math.sign(next - prev));
  window.scrollTo({top:0,behavior:"smooth"});
}
$("#tabs").addEventListener("click", e => {
  /* 刚拖完紧跟的那次 click 吃掉，只吃一次：吃完立刻关窗，
     免得紧接着的一次真实点击也被误伤。 */
  if(performance.now() < DR.suppressClick){
    DR.suppressClick = 0;
    e.preventDefault(); e.stopPropagation();
    return;
  }
  const b = e.target.closest("button[data-tab]"); if(b) go(b.dataset.tab);
});

function render(){
  // 用一个没有事件监听的空节点替换 #view，避免重复渲染时监听器叠加
  const old = $("#view");
  const v = old.cloneNode(false);
  v.removeAttribute("style");
  old.replaceWith(v);
  if(!W.length && tab !== "me") renderEmptyBank(v);
  else if(tab==="lib") renderLib(v);
  else if(tab==="card") renderCard(v);
  else if(tab==="quiz") renderQuiz(v);
  else if(tab==="wrong") renderWrong(v);
  else renderMe(v);
  v.classList.remove("view-in");
  void v.offsetWidth;
  /* 轻微淡入上浮，和导航指示器的弹簧同时起跑 */
  v.classList.add("view-in");
}

    + '</div>'
    + '<div style="margin-top:16px"><button class="btn" id="backcet4">先回 CET4</button></div>'
    + '</div></div>';

    +   '<button class="btn danger" id="wclear" '+(list.length?"":"disabled")+'>清空</button>'
    + '</div>'
    + (list.length
        ? list.map(x => '<div class="row" data-w="'+esc(x.w)+'">'

            + '</div>').join("")

  const wq = $("#wquiz"); if(wq) wq.addEventListener("click", () => { quiz.scope="WRONG"; quiz.running=false; go("quiz"); });
  const wcl = $("#wclear"); if(wcl) wcl.addEventListener("click", () => { if(confirm("确定清空错词本？学习状态不会丢失。")){ store.wr={}; save(); render(); paintHeader(); toast("错词本已清空"); } });
}

function download(name, text, type){
  if(window.Native && Native.save){
    try{ Native.save(String(name||"export.txt"), String(type||"text/plain"), String(text==null?"":text)); return; }catch(e){}
  }
  const blob = new Blob([text], {type:type + ";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ==================== 全局交互 ==================== */
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if(!$("#lock").hidden) return;          // 还锁着的时候不响应快捷键
  if(tab!=="card") return;
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flipCard(); }
  else if(e.key==="1") gradeCard(1);
  else if(e.key==="3") gradeCard(3);
  else if(e.key==="ArrowRight") nextCard();
  else if(e.key==="ArrowLeft") prevCard();
});

function resetAll(){
  if(!confirm("确定重置全部学习进度？词库本身不受影响。")) return;
  store = { st:{}, wr:{}, seen:{}, days:{} };
  save(); paintHeader(); render(); toast("学习进度已重置");
}

/* ==================== 底部导航栏防遮挡 ====================
   手机浏览器（尤其 Chrome/Safari 带底部工具栏、地址栏伸缩）中，
   position:fixed 是相对「布局视口」定位的，而布局视口会延伸到工具栏背后，
   于是 bottom:14px 的胶囊会被工具栏盖住一部分（实测被遮 42~76px）。
   这里用 visualViewport 算出「布局视口底部 − 可视视口底部」的差值，
   写入 --nav-lift，把导航栏整体抬到真正可见的区域里。 */
function syncNavLift(){
  const vv = window.visualViewport;
  let lift = 0;
  if(vv){
    // 可视视口底边相对布局视口底边的内缩量
    const inset = (window.innerHeight - (vv.height + vv.offsetTop));
    if(inset > 0) lift = Math.round(inset);
  }
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--nav-lift")) || 0;
  if(Math.abs(cur - lift) >= 1){
    document.documentElement.style.setProperty("--nav-lift", lift + "px");
  }
}
syncNavLift();
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", syncNavLift);
  window.visualViewport.addEventListener("scroll", syncNavLift);
}
window.addEventListener("resize", syncNavLift);
window.addEventListener("orientationchange", () => setTimeout(syncNavLift, 120));
/* 尺寸变化后重新对齐导航指示器（宽度会变，位置需重算）；手势中不要打断 */
const navRelayout = () => { if(!DR.on) navSlide(false); };
window.addEventListener("resize", navRelayout);
window.addEventListener("orientationchange", () => setTimeout(navRelayout, 200));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(navRelayout);
/* 内容长短变化会让竖向滚动条出现/消失，视口宽度一变格子就挪了，
   胶囊得跟着重新对位，否则会差那么几像素、看着「没对准」。 */
if(window.ResizeObserver){
  let barW = 0;
  new ResizeObserver(() => {
    const bar = $("#tabs");
    const w = bar ? Math.round(bar.clientWidth) : 0;
    if(w && w !== barW){ barW = w; if(!DR.on) navSlide(false); }
  }).observe($("#tabs"));
}

/* ==================== 启动闸门：设备激活 ====================
   设备码(ANDROID_ID 加盐哈希前 10 位) + 作者私钥签发的 ECDSA 码。
   没有有效激活码就进不去，APK 转发给别人也白搭。
   公钥嵌在下面，私钥在 tools/owner_key.json（不进 APK）。
   激活状态存 localStorage，跟着设备走；清数据后需重新激活（同一设备码仍可用）。 */
const PUB_KEY_B64 = "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEF4-LQZcTcJl9I8LcKeCjBqM0wDCGma41FxjdChQjZH_t-z_WGfmhzPO4SQhwpHx3uZgAPI2VZSmmwrrDHbCeUw";
const LIC_LS = "cet4-license-v1";

/* Web 版开关：浏览器里没有 ANDROID_ID，deviceRaw() 退化成每个浏览器随机生成的
   一串 id，激活闸门在这里等于「自己给自己发码」。所以网页版直接放行。
   要把它变成需要激活的私发版本，把这里改成 false（设备码仍会正常显示）。 */
const WEB_FREE = true;

/* base64url -> Uint8Array */
function b64uToBytes(s){
  s = String(s).replace(/-/g, "+").replace(/_/g, "/");
  s += "=".repeat((4 - s.length % 4) % 4);
  const bin = atob(s), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}

/* 设备码：优先用原生 ANDROID_ID 的加盐哈希；浏览器里退回随机 ID（仅调试用） */
function deviceRaw(){
  let raw = "";
  try{ if(window.Native && Native.deviceId) raw = String(Native.deviceId() || ""); }catch(e){}
  if(!raw){
    try{ raw = localStorage.getItem("cet4-device-id") || ""; }catch(e){}
    if(!raw){
      raw = Array.from(crypto.getRandomValues(new Uint8Array(8)))
        .map(b => b.toString(16).padStart(2, "0")).join("");
      try{ localStorage.setItem("cet4-device-id", raw); }catch(e){}
    }
  }
  return raw;
}
function deviceCode(){
  const h = deviceRaw().slice(0, 10).toUpperCase();
  return h.slice(0, 5) + "-" + h.slice(5);
}

/* 校验已存的激活码：设备码要对得上，签名要验得过 */
async function licenseOK(){
  let rec = null;
  try{ rec = JSON.parse(localStorage.getItem(LIC_LS) || "null"); }catch(e){}
  if(!rec || !rec.dev || !rec.code) return false;
  if(rec.dev !== deviceCode()) return false;
  try{
    const key = await crypto.subtle.importKey(
      "spki", b64uToBytes(PUB_KEY_B64),
      { name:"ECDSA", namedCurve:"P-256" }, false, ["verify"]);
    return await crypto.subtle.verify(
      { name:"ECDSA", hash:"SHA-256" }, key,
      b64uToBytes(rec.code), new TextEncoder().encode(rec.dev));
  }catch(e){ return false; }
}

/* ---------- 校验中 ---------- */
function renderChecking(){
  const body = $("#lockBody"); if(!body) return;
  body.dataset.mode = "chk";
  body.innerHTML =
      '<div class="lock-title">校验授权</div>'
    + '<div class="lock-sub">正在验证本机激活码…</div>';
}

function lockUnlock(){
  const l = $("#lock");
  if(!l) return;
  l.classList.add("out");
  document.body.classList.remove("lock-on");
  setTimeout(() => { l.hidden = true; }, 340);
}

/* ---------- 激活面板 ---------- */
function renderActivation(){
  const body = $("#lockBody"); if(!body) return;
  body.dataset.mode = "act";
  body.innerHTML =
      '<div class="lock-title">激活此设备</div>'
    + '<div class="lock-sub">把下面的设备码发给作者，换一个激活码</div>'
    + '<div class="act-device">'+esc(deviceCode())+'</div>'
    + '<button class="btn sm act-copy" id="actCopy">复制设备码</button>'
    + '<textarea class="act-input" id="actInput" rows="3" placeholder="粘贴激活码" spellcheck="false" autocomplete="off"></textarea>'
    + '<div class="lock-err" id="actErr"></div>'
    + '<button class="btn primary act-go" id="actGo">激活</button>'
    + '<div class="act-tip">激活码只对这一台设备有效，换手机需要重新申请。</div>';

  $("#actCopy").addEventListener("click", () => {
    const code = deviceCode();
    const done = () => toast("设备码已复制");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(done).catch(() => fallbackCopy(code, done));
    } else fallbackCopy(code, done);
  });
  $("#actGo").addEventListener("click", doActivate);
  $("#actInput").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); doActivate(); } });
}

function fallbackCopy(text, done){
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove(); done();
  }catch(e){ toast("复制失败，请手动抄下设备码"); }
}

async function doActivate(){
  const inp = $("#actInput"), err = $("#actErr"), l = $("#lock");
  if(!inp) return;
  const code = inp.value.replace(/[\s\r\n]/g, "");
  if(!code){ if(err) err.textContent = "先粘贴激活码"; return; }
  if(err) err.textContent = "";
  const dev = deviceCode();
  let ok = false;
  try{
    const key = await crypto.subtle.importKey(
      "spki", b64uToBytes(PUB_KEY_B64),
      { name:"ECDSA", namedCurve:"P-256" }, false, ["verify"]);
    ok = await crypto.subtle.verify(
      { name:"ECDSA", hash:"SHA-256" }, key,
      b64uToBytes(code), new TextEncoder().encode(dev));
  }catch(e){ ok = false; }

  if(!ok){
    if(err) err.textContent = "激活码无效，或不是这台设备的";
    if(l){ l.classList.remove("shake"); void l.offsetWidth; l.classList.add("shake"); }
    try{ if(navigator.vibrate) navigator.vibrate([12, 40, 12]); }catch(e2){}
    return;
  }
  try{ localStorage.setItem(LIC_LS, JSON.stringify({ dev: dev, code: code, at: Date.now() })); }catch(e){}
  toast("激活成功");
  lockUnlock();
}

/* ---------- 闸门初始化 ---------- */
function initGate(){
  const l = $("#lock");
  if(!l) return;
  if(WEB_FREE){ lockUnlock(); return; }   // Web 版：不进闸门
  l.hidden = false;
  document.body.classList.add("lock-on");
  // 没存过激活码 → 直接进激活面板；存过 → 先显示「校验中」，验签过了才放行，
  // 防止伪造/换机的记录直接混进去。
  if(!localStorage.getItem(LIC_LS)){ renderActivation(); return; }
  renderChecking();
  licenseOK().then(ok => { if(ok) lockUnlock(); else renderActivation(); });
}

/* ---------- 开屏封面 ---------- */
function coverDone(){
  const c = $("#cover");
  if(!c || c.classList.contains("out")) return;
  c.classList.add("out");
  setTimeout(() => { c.hidden = true; }, 520);
}
function initCover(){
  const c = $("#cover");
  if(!c) return;
  c.addEventListener("click", coverDone);   // 点一下立刻进
  setTimeout(coverDone, 1800);              // 否则 1.8s 自动过
}

/* ==================== 启动 ==================== */
/* 关掉双指缩放：viewport 已声明 user-scalable=no，这里再补一道手势拦截，
   防止某些 WebView / 浏览器内核忽略 meta 后仍能捏合放大。
   只拦「两指以上」的 touchmove，单指拖拽（导航长按滑动）不受影响。 */
document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturechange", e => e.preventDefault(), { passive: false });
document.addEventListener("touchmove", e => {
  if(e.touches && e.touches.length > 1) e.preventDefault();
}, { passive: false });
/* 桌面/触控板：Ctrl+滚轮 或 触控板捏合 会被浏览器当成页面缩放，一并拦掉 */
document.addEventListener("wheel", e => { if(e.ctrlKey) e.preventDefault(); }, { passive: false });

/* 品牌胶囊：点开三颗小胶囊，选库后整页重画 */
$("#brandBtn").addEventListener("click", e => {
  e.stopPropagation();
  const pop = $("#bankPop");
  if(pop && pop.hidden) openBankPop(); else closeBankPop();
});
$("#bankPop").addEventListener("click", e => {
  const c = e.target.closest(".bank-chip"); if(!c) return;
  switchBank(c.dataset.bank);
});
document.addEventListener("keydown", e => { if(e.key === "Escape") closeBankPop(); });

/* 流动背景：切到后台就把动画暂停（CSS 动画跑在合成线程上，WebView 不一定替你停） */
document.addEventListener("visibilitychange", () => {
  document.documentElement.classList.toggle("flow-pause", document.hidden);
});

let savedBank = "cet4";
try{ savedBank = localStorage.getItem(BANK_LS) || "cet4"; }catch(e){}
applyBank(savedBank);          // 内部会 load() 当前库的进度
paintHeader();
render();
syncNavLift();
navSlide(false);   // 初始化导航指示器位置
initGate();        // 设备激活闸门
initCover();       // 开屏封面（1.8s 或点击跳过）
</script>
<script>
/* PWA：词库全在页面里，缓存一份就能彻底离线跑。注册失败不影响正常使用。 */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}
  svg{display:block;width:100%;height:100%}
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="0.55" stop-color="#e4edfb"/>
      <stop offset="1" stop-color="#d6e3f6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa8ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#9a8cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9a8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="0.35" stop-color="#fff3b0"/>
      <stop offset="0.72" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#ffb300"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffc21f" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 背景两团柔光，呼应应用里的流动色斑 -->
  <circle cx="150" cy="128" r="230" fill="url(#halo)"/>
  <circle cx="392" cy="404" r="190" fill="url(#halo)" opacity="0.75"/>

  <!-- 萤火：外圈光晕 + 实心核 + 四道短光芒 -->
  <circle cx="256" cy="252" r="132" fill="url(#glow)"/>
  <circle cx="256" cy="252" r="78" fill="url(#core)"/>
  <g stroke="#ffd24a" stroke-linecap="round" opacity="0.9">
    <path d="M256 118 v-34" stroke-width="13"/>
    <path d="M256 386 v34" stroke-width="13"/>
    <path d="M122 252 h-34" stroke-width="13"/>
    <path d="M390 252 h34" stroke-width="13"/>
  </g>
  <g stroke="#ffd24a" stroke-linecap="round" opacity="0.55">
    <path d="M161 157 l-24 -24" stroke-width="10"/>
    <path d="M351 347 l24 24" stroke-width="10"/>
    <path d="M351 157 l24 -24" stroke-width="10"/>
    <path d="M161 347 l-24 24" stroke-width="10"/>
  </g>
</svg>
</body></html>
